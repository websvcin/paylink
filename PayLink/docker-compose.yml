# Run from this folder (PayLink/).
# PayLink alone (SQLite for the platform and tenants):
#   docker compose up -d
#   docker compose logs paylink        # shows the one-time setup code
#   open http://localhost:8080/setup
#
# With a MySQL server PayLink can use for the platform database and for auto-provisioned tenant databases:
#   MYSQL_ROOT_PASSWORD=choose-one docker compose --profile mysql up -d
# In setup → Database hosting, choose "A MySQL server": host mysql, port 3306, user root, the password above.
#
# With a PostgreSQL server for the platform database (or tenants' own databases):
#   POSTGRES_PASSWORD=choose-one docker compose --profile postgres up -d
# In setup → Platform database, choose "MySQL or PostgreSQL: a server I run", PostgreSQL, host postgres, port 5432,
# database paylink, user postgres, the password above.

services:
  paylink:
    image: websvcin/paylink:latest
    build:
      # The image also needs ../packages and ../scripts, so it builds from the repository root.
      context: ..
      dockerfile: PayLink/Dockerfile
    container_name: paylink
    ports:
      - "8080:8080"
    volumes:
      - ./App_Data:/app/App_Data
    environment:
      # Behind a reverse proxy, list its address so client IPs and https are read correctly.
      - PayLink__TrustedProxies=
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    container_name: paylink-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    container_name: paylink-postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=paylink
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
